name: Validate and conditionally publish personal site
on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run test:release
      - name: Assess publication readiness
        id: readiness
        run: node scripts/release.mjs --ci
      - name: Require launch readiness before publication
        if: github.event_name != 'pull_request' && steps.readiness.outputs.ready == 'true'
        run: node scripts/release.mjs --strict
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && steps.readiness.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && steps.readiness.outputs.ready == 'true'
        with:
          path: dist
  deploy:
    name: Publish approved site
    if: github.event_name != 'pull_request' && needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
