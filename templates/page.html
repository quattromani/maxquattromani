<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title | escape }} | {{ site.title | escape }}</title>
    <meta name="description" content="{{ description | escape }}" />
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="{{ site.title | escape }}"
      href="/feed.xml"
    />
    <meta
      property="og:type"
      content="{% if page.post %}article{% else %}website{% endif %}"
    />
    <meta property="og:title" content="{{ title | escape }}" />
    <meta property="og:description" content="{{ description | escape }}" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <link rel="stylesheet" href="/assets/site.css" />
    <script src="/assets/site.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to main content</a>
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="{{ site.title | escape }} home"
        >mq<span aria-hidden="true">.</span></a
      >
      <button
        class="menu-button"
        aria-expanded="false"
        aria-controls="primary-nav"
        hidden
      >
        Menu
      </button>
      <nav id="primary-nav" aria-label="Main navigation">{{ navigation }}</nav>
    </header>
    <main
      id="content"
      class="{% if page.url == '/' %}home{% else %}inner-page{% endif %}"
    >
      {{ body }}
    </main>
    <footer class="site-footer">
      <div class="footer-top">
        <a class="footer-name" href="/"
          >Max<br />Quattromani<span aria-hidden="true">.</span></a
        >
        <nav aria-label="Resources">{{ resources }}</nav>
        <nav aria-label="Social links">
          <a href="https://github.com/quattromani">Github ↗</a>
          <a href="http://codepen.io/quattromani/">Codepen ↗</a>
          <a href="https://dribbble.com/maxquattromani">Dribbble ↗</a>
        </nav>
      </div>
      <div class="footer-bottom">
        <span>Copyright Me. Everything. Every year, forever.</span>
        <a href="/sitemap/">Sitemap</a>
      </div>
    </footer>
  </body>
</html>
